# The same checks as `npm run check`, cargo fmt, clippy and the Rust tests, on Linux,
# end-to-end tests of the window over a simulated native process, and a walk through the
# real app (Rust, SQLite and WebKitGTK) driven by tauri-driver.
# The HTTP tests only talk to a server on 127.0.0.1 and the reserved `.invalid` domain.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: End to end · preview in Chrome
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Drives the Chrome the runner already has: no browser is downloaded.
      - run: npm run e2e

  rust:
    name: Rust · fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Tauri 2 on Linux: WebKitGTK and friends. OpenSSL headers back native-tls.
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  native:
    name: End to end · native window (WebKitGTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Tauri's prerequisites, plus the WebKit WebDriver and a virtual X display.
      - name: Install Tauri prerequisites, WebKitWebDriver and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same version as the cloud session hook installs.
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: npm run e2e:native
      - name: Keep the screenshots of each step
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-walk-linux
          path: test-results/native/
          retention-days: 7
          if-no-files-found: ignore
