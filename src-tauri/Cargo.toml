[package]
name = "devhq"
version = "0.1.0"
description = "The operations home for a personal software ecosystem"
authors = ["DevHQ"]
edition = "2021"
# File::try_lock and lock_shared, which tell the agent gate that a window is open.
rust-version = "1.89"

[lib]
name = "devhq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
# HTTP checks: the operating system's TLS stack and trust store, no proxy,
# cookies, HTTP/2 or decompression.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
serde_json = "1"
# The agent gate finds the inventory where Tauri's app_data_dir puts it, without a window: Tauri
# resolves that directory with this same crate.
dirs = "6"
# The supervision loop runs on Tauri's own Tokio runtime.
tokio = { version = "1", features = ["net", "time", "rt", "sync", "macros"] }
# Local copies are read with libgit2, which never runs a program a repository names (hooks,
# filters, fsmonitor, signing or remote helpers), built from its own sources like SQLite and
# without any network transport (no https, no ssh).
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# The fingerprint that tells this computer apart in the local workstation file. Already built for
# wry; no new crate.
sha2 = "0.10"

# The reader of local copies forbids itself to start programs: a Job Object on Windows, and the
# MachineGuid that fingerprints the computer is in the registry.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# A seccomp filter on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Paused time: supervision is tested on a simulated clock, without real waits.
tokio = { version = "1", features = ["test-util"] }
# A mock runtime, without a window or WebView, that answers IPC requests through the real
# command handler: the IPC contract tests send the window's fixtures through it.
tauri = { version = "2", features = ["test"] }
